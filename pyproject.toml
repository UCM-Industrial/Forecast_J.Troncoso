[project]
name = "recast"
version = "2.0.0"
description = "End-to-end pipeline for renewable energy generation forecasting using XGBoost and ECMWF weather data"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  # ── Core ML ──
  "xgboost>=3.0.2",
  "scikit-learn>=1.6.1",
  "pandas>=2.2.3",
  "numpy>=2.2.4",
  "joblib>=1.4.2",

  # ── Climate Data ──
  "xarray>=2025.4.0",
  "cfgrib>=0.9.15.0",
  "netcdf4>=1.7.2",
  "ecmwf-opendata>=0.3.20",

  # ── Geospatial ──
  "geopandas>=1.0.1",
  "regionmask>=0.13.0",
  "shapely>=2.1.1",

  # ── Cloud & API ──
  "google-cloud-storage>=2.19.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.34.0",

  # ── Orchestration ──
  "prefect>=3.0.0",

  # ── Configuration & Utils ──
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "pyyaml>=6.0.2",
  "tenacity>=9.1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.11.4",
  "ty>=0.0.1a7",
  "httpx>=0.28.0",
]

[tool.ruff]
src = ["src"]
exclude = [
  ".venv",
  ".mypy_cache",
  ".ruff_cache",
  "**/.cache",
  "build",
  "dist",
  ".git",
  ".pytest_cache",
]

line-length = 100

[tool.ruff.lint]
select = [
  "E",    # PEP 8 errors
  "F",    # Pyflakes
  "I",    # isort
  "UP",   # pyupgrade
  "D",    # pydocstyle
  "ANN",  # flake8-annotations
  "S",    # flake8-bandit
  "BLE",  # flake8-blind-except
  "A",    # flake8-builtins
  "C4",   # flake8-comprehensions
  "PL",   # pylint (a subset)
  "TRY",  # tryceratops
  "SLF",  # flake8-self
  "SIM",  # flake8-simplify
  "FURB", # refurb
  "RUF",  # Ruff-specific rules
  "N",    # pep8-naming
  "COM",  # flake8-commas
  "PERF", # Perflint
  "PLC",  # pylint-convention
]

ignore = [
  "E501",   # Line too long
  "D100",   # Missing docstring in public module
  "D104",   # Missing docstring in public package
  "D400",   # First line should end with a period
  "ANN001", # Missing type annotation for function argument
  "ANN002", # Missing type annotation for *args
  "ANN003", # Missing type annotation for **kwargs
  "ANN201", # Missing return type annotation for public function
  "ANN202", # Missing return type annotation for public method
  "TRY003", # Raise vanilla args
]

fixable = ["E", "F", "I", "UP", "RUF", "SIM", "COM", "D"]

pydocstyle.convention = "google"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
