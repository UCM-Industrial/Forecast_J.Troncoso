# ============================================================
# RECAST — Global Configuration
# ============================================================

# --- Training data: ERA5 (climate features) ---
era5:
  dataset: "reanalysis-era5-single-levels"
  product_type: "reanalysis"
  variables:
    - "100m_v_component_of_wind"
    - "100m_u_component_of_wind"
    - "surface_solar_radiation_downwards"
  area: [-17, -76, -56, -66]  # Chile [N, W, S, E]
  format: "grib"

# --- Training data: CEN (generation targets) ---
cen:
  source_dir: "data/cen"
  generation_col: "generation_mwh"
  datetime_col: "datetime"

# --- Prediction data: AIFS-single (forecast features) ---
aifs:
  model: "aifs-single"
  type: "fc"
  variables:
    - "100v"   # 100m v-component of wind
    - "100u"   # 100m u-component of wind
    - "ssrd"   # Surface solar radiation downwards
  steps: [0, 6, 12, 18, 24, 30, 36, 42, 48, 54, 60, 66, 72, 78, 84, 90, 96, 102, 108, 114, 120, 126, 132, 138, 144, 150, 156, 162, 168, 174, 180, 186, 192, 198, 204, 210, 216, 222, 228, 234, 240, 246, 252, 258, 264, 270, 276, 282, 288, 294, 300, 306, 312, 318, 324, 330, 336, 342, 348, 354]
  time: 0

# --- Storage ---
gcs:
  bucket: "recast-energy-forecast"
  prefixes:
    raw_era5: "raw/era5"
    raw_aifs: "raw/aifs"
    raw_cen: "raw/cen"
    processed_era5: "processed/era5_parquet"
    processed_training: "processed/training"
    processed_prediction: "processed/prediction"
    models: "models"
    predictions: "predictions"

# --- Geospatial ---
geospatial:
  regions_shapefile: "data/masks/Regional.shp"
  segment_by: "Region"
  output_timezone: "America/Santiago"
  chunk_size:
    latitude: 50
    longitude: 50

# --- Training ---
training:
  test_size: 0.2
  cv_folds: 5
  random_seed: 42
  xgboost:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.1
    objective: "reg:squarederror"

# --- Prediction ---
prediction:
  output_format: "csv"
  technologies:
    - "solar"
    - "wind"
