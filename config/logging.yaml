# ============================================================
# RECAST — Logging Configuration
# ============================================================

version: 1
disable_existing_loggers: false

formatters:
  console:
    format: "%(asctime)s %(levelname)-8s %(name)s: %(message)s"
    datefmt: "%H:%M:%S"
  file:
    format: "%(asctime)s | %(levelname)-8s | %(name)s | %(funcName)s:%(lineno)d | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: console
    stream: ext://sys.stdout
  file:
    class: logging.FileHandler
    level: DEBUG
    formatter: file
    filename: logs/recast.log
    encoding: utf-8

loggers:
  recast:
    level: INFO
    handlers: [console, file]
    propagate: false

root:
  level: WARNING
  handlers: [console]
